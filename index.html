<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do-list</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section>
      <div class="todo-list d-flex justify-content-center align-items-center">
        <form class="todo-form">
          <div class="header d-flex align-items-center justify-content-between pb-4">
            <a href="index.html" class="fs-4 text-white text-decoration-none fw-bold">TODO</a>
            <div class="icons">
              <i class="fa-regular fa-sun"></i>
              <i class="fa-regular fa-moon"></i>
            </div>
          </div>
          <div class="task-input d-flex gap-3">
            <input type="text" name="task" id="task" placeholder="Enter task">
            <button id="task-button">Add</button>
          </div>
          <div class="task-items">

          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
